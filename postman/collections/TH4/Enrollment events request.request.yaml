$kind: http-request
url: "{{base_url}}/enrollment-events?student_id=22000001&event_type=CREATED&skip=0&limit=10"
method: GET
queryParams:
  student_id: "22000001"
  event_type: "CREATED"
  skip: "0"
  limit: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code la 200", () => {
          pm.response.to.have.status(200);
      });

      pm.test("Co du lieu enrollment events", () => {
          const data = pm.response.json();
          pm.expect(data).to.be.an("array");
          pm.expect(data.length).to.be.above(0);
      });

      pm.test("Dung bo loc event_type", () => {
          const data = pm.response.json();
          data.forEach((event) => {
              pm.expect(event.event_type).to.eql("CREATED");
          });
      });

      pm.test("Dung bo loc student_id", () => {
          const data = pm.response.json();
          data.forEach((event) => {
              pm.expect(event.student_id).to.eql("22000001");
          });
      });
    language: text/javascript
order: 2400